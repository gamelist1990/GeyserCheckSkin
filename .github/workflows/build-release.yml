name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash ./gradlew -q printVersion --no-daemon --console=plain)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: $version"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match build version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: bash ./gradlew clean build --no-daemon --console=plain

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          jar="GeyserCheckSkin-$VERSION.jar"
          test -s "build/libs/$jar"
          cd build/libs
          sha256sum "$jar" > SHA256SUMS

      - name: Upload tested JAR and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GeyserCheckSkin-${{ steps.version.outputs.version }}
          path: |
            build/libs/GeyserCheckSkin-${{ steps.version.outputs.version }}.jar
            build/libs/SHA256SUMS
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: GeyserCheckSkin-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Verify assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving published assets unchanged."
            exit 0
          fi
          printf '%s\n' \
            "GeyserCheckSkin $TAG" \
            '' \
            'GitHub ActionsでJava 21によるビルド・テストを実行したJARです。' \
            'Geyserの extensions/ にJARを配置して再起動してください。対象はGeyser 2.11.3系です。' \
            'SHA256SUMSを同梱しています。' > release-notes.md
          gh release create "$TAG" \
            "release-assets/GeyserCheckSkin-$VERSION.jar" \
            release-assets/SHA256SUMS \
            --verify-tag --title "GeyserCheckSkin $TAG" --notes-file release-notes.md
